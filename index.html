<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magazyn</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#f8fafc;--mu:#94a3b8;--bd:#334155;--ac:#38bdf8;--pr:#0284c7}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--tx);padding:12px 12px 80px;display:flex;justify-content:center}
.c{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px}
h1{font-size:1.2rem;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
label{font-size:.75rem;font-weight:600;color:var(--mu);text-transform:uppercase}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:10px;color:var(--tx);font-size:1rem;width:100%}
.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:13px;font-size:1rem;font-weight:600;cursor:pointer}
.b.g{background:#475569}.b.o{background:#16a34a}.b:disabled{opacity:.5}
.cam{border:2px dashed var(--ac);border-radius:10px;padding:18px;text-align:center;color:var(--ac);font-weight:600;cursor:pointer}
#st{display:none;padding:10px;border-radius:6px;text-align:center;word-break:break-word;font-size:.9rem}
.i{background:#0369a1}.s{background:#16a34a}.e{background:#dc2626}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;padding:16px;background:none;border:0;color:var(--mu);font-size:1rem}
nav button.on{color:var(--ac);font-weight:700}
.tab{display:none;flex-direction:column;gap:12px}.tab.on{display:flex}
.r{padding:10px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;font-size:.9rem}
.r small{color:var(--mu);display:block}
#lg{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#pv{width:100%;max-height:200px;object-fit:contain;border-radius:8px;background:#000;display:none}
</style></head><body>
<div id="lg"><div class="card" style="width:100%;max-width:340px"><h1>Magazyn</h1><label>Hasło</label>
<input type="password" id="pin" autocomplete="current-password"><button class="b" onclick="login()">Wejdź</button></div></div>
<div class="c">
<h1>Skaner Magazynowy</h1><div id="st"></div>

<div class="tab on" id="t0">
<div class="card"><label>Dok. przyjęcia (WZ / faktura dostawcy)</label><input id="dokPrz"></div>
<div class="card"><label for="fi" class="cam">📷 Zrób zdjęcie etykiety</label>
<input type="file" id="fi" accept="image/*" capture="environment" hidden><img id="pv"></div>
<div class="card">
<label>Producent</label><input id="producent"><label>Model</label><input id="model" list="ml">
<datalist id="ml"></datalist><label>Numer seryjny (S/N)</label><input id="sn">
<label>MAC</label><input id="mac"><label>P/N</label><input id="pn"><label>FW / Rev</label><input id="fw">
<label>Uwagi</label><input id="uwagi">
<button class="b" id="sv" onclick="add()">Zapisz w magazynie</button>
<button class="b g" onclick="clr()">Wyczyść</button></div></div>

<div class="tab" id="t1">
<div class="card"><label>S/N urządzenia</label><input id="wsn"><button class="b" onclick="find()">Znajdź</button><div id="kt"></div></div>
<div class="card" id="wf" style="display:none">
<label>Klient</label><input id="klient"><label>Dok. wydania (WZ / faktura)</label><input id="dokWyd">
<label>Handlowiec</label><input id="handlowiec">
<button class="b g" onclick="act('Zarezerwowany')">Zarezerwuj</button>
<label>Kurier</label><select id="kurier"><option></option><option>DHL</option><option>DPD</option><option>InPost</option><option>UPS</option><option>FedEx</option><option>Odbiór osobisty</option></select>
<label>Nr listu przewozowego</label><input id="list">
<button class="b o" onclick="act('Wysłany')">Wyślij</button></div></div>

<div class="tab" id="t2"><div class="card"><label>Szukaj (S/N, MAC, klient, WZ, model…)</label>
<input id="q"><button class="b" onclick="srch()">Szukaj</button></div><div id="res" style="display:flex;flex-direction:column;gap:8px"></div></div>
</div>
<nav><button class="on" onclick="tab(0,this)">Przyjęcie</button><button onclick="tab(1,this)">Wydanie</button><button onclick="tab(2,this)">Szukaj</button></nav>

<script>
const URL_="https://script.google.com/macros/s/AKfycbymCX6LWnN7MDzrfGMMlBc2gAn8tbUYnshA8Pp9XinmUUDp12gqw-NLmZanNxhBvvqW-A/exec";
const $=id=>document.getElementById(id);
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch{return null}};
let PIN=ls('pin2')||'';
const F=['producent','model','sn','mac','pn','fw','uwagi'];

function st(t,c){const s=$('st');s.className=c;s.textContent=t;s.style.display=t?'block':'none'}
async function api(a,d={}){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),90000);let t;
  try{const r=await fetch(URL_,{method:'POST',signal:ac.signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...d,action:a,pin:PIN})});t=await r.text()}
  catch(x){throw new Error(x.name==='AbortError'?'Brak odpowiedzi przez 90 s. Sprawdź „Wykonania” w Apps Script.':x.message)}
  finally{clearTimeout(tm)}
  let j;
  try{j=JSON.parse(t)}catch{throw new Error('Skrypt zwrócił stronę zamiast JSON – sprawdź wdrożenie (dostęp: Anyone).')}
  if(j.status==='badpin'){PIN='';ls('pin2','');$('lg').style.display='flex';throw new Error('Złe hasło')}
  if(j.status==='error')throw new Error(j.error);return j}
async function login(){PIN=$('pin').value.trim();
  try{const r=await api('ping');ls('pin2',PIN);$('lg').style.display='none';st('');$('ml').innerHTML=r.models.map(m=>`<option value="${m}">`).join('')}
  catch(e){alert(e.message)}}
window.onload=()=>{$('dokPrz').value=ls('dokPrz')||'';PIN?login():$('lg').style.display='flex'};
function tab(n,b){document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',i==n));
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b))}

function img(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();
  i.onload=()=>{const k=Math.min(1,1400/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);
  URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.85).split(',')[1])};i.onerror=()=>no(new Error('Nie można wczytać zdjęcia'));i.src=u})}
$('fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  let n=0,iv;try{st('Odczyt etykiety… 0 s','i');iv=setInterval(()=>st('Odczyt etykiety… '+(++n)+' s','i'),1000);const b=await img(f);$('pv').src='data:image/jpeg;base64,'+b;$('pv').style.display='block';
    const d=(await api('analyze',{image:b})).data;
    $('producent').value=d.producent||'';$('model').value=d.model||'';$('sn').value=d.serial||'';
    $('mac').value=d.mac||'';$('pn').value=d.pn||'';$('fw').value=d.fw||'';
    clearInterval(iv);st('Sprawdź dane (zwłaszcza S/N) i zapisz.','s')}catch(x){clearInterval(iv);st('Błąd odczytu: '+x.message,'e')}};
function clr(){F.forEach(k=>$(k).value='');$('pv').style.display='none';$('fi').value='';st('')}
async function add(force){
  const d={dokPrz:$('dokPrz').value.trim(),force:force===true};F.forEach(k=>d[k]=$(k).value.trim());
  ls('dokPrz',d.dokPrz);if(!d.sn)return st('Wpisz S/N.','e');
  try{st('Zapisywanie…','i');const r=await api('add',d);
    if(r.status==='duplicate'){st('');
      if(confirm(`S/N już jest w bazie (${r.row.model}, status: ${r.row.status}${r.row.klient?', klient: '+r.row.klient:''}).\nZapisać mimo to?`))return add(true);return}
    st('Dodano do magazynu ✔','s');clr();st('Dodano do magazynu ✔','s')}catch(x){st('Błąd zapisu: '+x.message,'e')}}

let cur=null;
async function find(){const sn=$('wsn').value.trim();if(!sn)return;
  try{st('Szukanie…','i');const r=await api('find',{sn});st('');cur=r.row;
    if(!cur){$('kt').textContent='Nie ma takiego S/N w magazynie.';$('wf').style.display='none';return}
    $('kt').innerHTML=`<b>${cur.model}</b> · S/N ${cur.sn}<br>Status: <b>${cur.status}</b>${cur.klient?' · '+cur.klient:''}`;
    ['klient','dokWyd','handlowiec','kurier','list'].forEach(k=>$(k).value=cur[k]||'');$('wf').style.display='flex'}
  catch(x){st(x.message,'e')}}
async function act(s){if(!cur)return;
  if(!$('klient').value.trim())return st('Wpisz klienta.','e');
  if(s==='Wysłany'&&!$('kurier').value)return st('Wybierz kuriera.','e');
  try{st('Zapisywanie…','i');await api('issue',{sn:cur.sn,newStatus:s,klient:$('klient').value.trim(),dokWyd:$('dokWyd').value.trim(),
    handlowiec:$('handlowiec').value.trim(),kurier:$('kurier').value,list:$('list').value.trim()});
    st(s==='Wysłany'?'Oznaczono jako wysłane ✔':'Zarezerwowano ✔','s');find()}catch(x){st('Błąd: '+x.message,'e')}}

async function srch(){const q=$('q').value.trim();if(!q)return;
  try{st('Szukanie…','i');const r=await api('search',{q});st('');
    $('res').innerHTML=r.rows.length?'':'<div class="r">Brak wyników.</div>';
    r.rows.forEach(x=>{const d=document.createElement('div');d.className='r';
      d.innerHTML=`<b>${x.model}</b> · ${x.sn}<small>${x.status}${x.klient?' · '+x.klient:''}${x.dokWyd?' · '+x.dokWyd:''}${x.mac?' · '+x.mac:''}</small>`;
      d.onclick=()=>{$('wsn').value=x.sn;tab(1,document.querySelectorAll('nav button')[1]);find()};$('res').appendChild(d)})}
  catch(x){st(x.message,'e')}}
</script></body></html>
