<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skaner Magazynowy AI</title>
  <style>
    :root {
      --primary: #0284c7; --primary-hover: #0369a1; --bg: #0f172a; --card-bg: #1e293b;
      --text: #f8fafc; --text-muted: #94a3b8; --border: #334155;
      --success: #16a34a; --error: #dc2626; --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .settings-btn { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .camera-trigger { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed var(--accent); border-radius: 10px; padding: 22px; cursor: pointer; background: rgba(56,189,248,.05); text-align: center; gap: 8px; }
    .camera-trigger span { font-weight: 600; color: var(--accent); font-size: 1.1rem; }
    .camera-trigger small { color: var(--text-muted); font-size: 0.8rem; }
    #fileInput { display: none; }
    #previewImg { width: 100%; max-height: 220px; object-fit: contain; border-radius: 8px; display: none; background: #000; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
    input, textarea { background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 10px; color: var(--text); font-size: 1rem; width: 100%; }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
    .checkbox-row input { width: auto; cursor: pointer; }
    .btn { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; text-align: center; transition: background .2s; }
    .btn:active { background: var(--primary-hover); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    #status { font-size: 0.9rem; text-align: center; padding: 10px; border-radius: 6px; display: none; word-break: break-word; }
    .status-info { background: #0369a1; color: #fff; }
    .status-success { background: var(--success); color: #fff; }
    .status-error { background: var(--error); color: #fff; }
    #settingsModal { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Skaner Magazynowy</h1>
      <button class="settings-btn" onclick="toggleSettings(true)">Ustawienia</button>
    </header>

    <div id="status"></div>

    <div class="card">
      <div class="field">
        <label for="clientField">Klient / Zamówienie docelowe</label>
        <input type="text" id="clientField" placeholder="np. Firma ABC / ZAM-2026-001">
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="keepClientCheckbox" checked>
        <span>Zapamiętaj klienta dla kolejnych skanów</span>
      </label>
    </div>

    <div class="card">
      <label for="fileInput" class="camera-trigger">
        <svg width="32" height="32" fill="none" stroke="#38bdf8" stroke-width="2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Zrób zdjęcie etykiety</span>
        <small>Aparat uruchomi się automatycznie</small>
      </label>
      <input type="file" id="fileInput" accept="image/*" capture="environment">
      <img id="previewImg" alt="Podgląd etykiety">
    </div>

    <div class="card">
      <div class="field">
        <label for="modelField">Model / Urządzenie</label>
        <input type="text" id="modelField" placeholder="Wykryty model">
      </div>
      <div class="field">
        <label for="serialField">Numer Seryjny (S/N)</label>
        <input type="text" id="serialField" placeholder="Wykryty S/N">
      </div>
      <div class="field">
        <label for="macField">Adres MAC</label>
        <input type="text" id="macField" placeholder="XX:XX:XX:XX:XX:XX">
      </div>
      <div class="field">
        <label for="extraField">Dodatkowe informacje (P/N, Part No, Uwagi)</label>
        <textarea id="extraField" rows="2" placeholder="Pozostałe parametry"></textarea>
      </div>
      <button id="saveBtn" class="btn" onclick="saveToSheets()" disabled>Zapisz w Arkuszu Google</button>
    </div>
  </div>

  <div id="settingsModal">
    <div class="card" style="width:100%;max-width:420px;">
      <h2 style="font-size:1.1rem;color:#38bdf8;">Ustawienia</h2>
      <div class="field">
        <label for="scriptUrlInput">URL Google Apps Script (/exec)</label>
        <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <small style="color:#94a3b8">Klucz Gemini nie jest już potrzebny w aplikacji – jest przechowywany w Apps Script.</small>
      <button class="btn" onclick="saveSettings()">Zapisz</button>
      <button class="settings-btn" style="border:none;" onclick="toggleSettings(false)">Zamknij</button>
    </div>
  </div>

  <script>
    // URL w formie /macros/s/<ID>/exec (BEZ /a/macros/domena/), wdrożenie: dostęp "Anyone"
    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbymCX6LWnN7MDzrfGMMlBc2gAn8tbUYnshA8Pp9XinmUUDp12gqw-NLmZanNxhBvvqW-A/exec";
    const URL_KEY = 'gas_url_v3'; // nowy klucz – ignoruje stare, błędne wpisy z localStorage

    const $ = (id) => document.getElementById(id);
    const fileInput = $('fileInput'), previewImg = $('previewImg'), saveBtn = $('saveBtn'),
          statusDiv = $('status'), clientField = $('clientField'),
          keepClientCheckbox = $('keepClientCheckbox'), scriptUrlInput = $('scriptUrlInput');

    function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
    function lsDel(k) { try { localStorage.removeItem(k); } catch {} }

    function getGasUrl() { return lsGet(URL_KEY) || DEFAULT_GAS_URL; }

    window.addEventListener('load', () => {
      scriptUrlInput.value = getGasUrl();
      clientField.value = lsGet('last_client') || '';
    });

    function toggleSettings(show) { $('settingsModal').style.display = show ? 'flex' : 'none'; }

    function saveSettings() {
      const url = scriptUrlInput.value.trim();
      if (!url) { lsDel(URL_KEY); } else { lsSet(URL_KEY, url); }
      toggleSettings(false);
      showStatus('Zapisano ustawienia.', 'status-success');
    }

    function showStatus(text, cls) {
      statusDiv.className = cls;
      statusDiv.textContent = text;
      statusDiv.style.display = 'block';
    }

    // Wywołanie Apps Script: text/plain = "proste żądanie" bez preflightu CORS
    async function callGas(payload) {
      const res = await fetch(getGasUrl(), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        redirect: 'follow'
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); }
      catch {
        throw new Error('Skrypt zwrócił stronę zamiast JSON (prawdopodobnie logowanie). Wdróż skrypt z dostępem "Anyone" i użyj adresu /macros/s/.../exec.');
      }
      if (data.status !== 'success') throw new Error(data.error || 'Nieznany błąd skryptu');
      return data;
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      saveBtn.disabled = true;
      showStatus('Kompresowanie zdjęcia...', 'status-info');

      try {
        const base64Image = await resizeAndConvertImage(file);
        previewImg.src = 'data:image/jpeg;base64,' + base64Image;
        previewImg.style.display = 'block';

        showStatus('AI analizuje etykietę...', 'status-info');
        const res = await callGas({ action: 'analyze', image: base64Image });

        $('modelField').value = res.data.model || '';
        $('serialField').value = res.data.serial || '';
        $('macField').value = res.data.mac || '';
        $('extraField').value = res.data.extra || '';

        showStatus('Dane odczytane! Sprawdź poprawność i kliknij Zapisz.', 'status-success');
      } catch (err) {
        showStatus('Błąd odczytu AI: ' + err.message, 'status-error');
      } finally {
        saveBtn.disabled = false; // można wpisać/poprawić ręcznie
      }
    });

    function resizeAndConvertImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const maxDim = 1400;
          let w = img.naturalWidth, h = img.naturalHeight;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          w = Math.round(w * scale); h = Math.round(h * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Nie można wczytać zdjęcia.')); };
        img.src = url;
      });
    }

    async function saveToSheets() {
      saveBtn.disabled = true;
      showStatus('Wysyłanie danych do arkusza...', 'status-info');

      const clientVal = clientField.value.trim();
      if (keepClientCheckbox.checked && clientVal) lsSet('last_client', clientVal);

      try {
        await callGas({
          action: 'save',
          client: clientVal,
          model: $('modelField').value,
          serial: $('serialField').value,
          mac: $('macField').value,
          extra: $('extraField').value
        });

        showStatus('Pomyślnie dodano wiersz do Arkusza!', 'status-success');

        setTimeout(() => {
          ['modelField', 'serialField', 'macField', 'extraField'].forEach(id => $(id).value = '');
          previewImg.style.display = 'none';
          fileInput.value = '';
          statusDiv.style.display = 'none';
          if (!keepClientCheckbox.checked) { clientField.value = ''; lsDel('last_client'); }
          saveBtn.disabled = true;
        }, 1500);
      } catch (err) {
        showStatus('Błąd zapisu: ' + err.message, 'status-error');
        saveBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
