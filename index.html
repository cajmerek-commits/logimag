<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Skaner Magazynowy AI</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #16a34a;
      --error: #dc2626;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .settings-btn { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    .camera-trigger {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 2px dashed var(--accent); border-radius: 10px; padding: 22px; cursor: pointer;
      background: rgba(56, 189, 248, 0.05); text-align: center; gap: 8px;
    }
    .camera-trigger span { font-weight: 600; color: var(--accent); font-size: 1.1rem; }
    .camera-trigger small { color: var(--text-muted); font-size: 0.8rem; }
    #fileInput { display: none; }

    #previewImg { width: 100%; max-height: 180px; object-fit: contain; border-radius: 8px; display: none; background: #000; }

    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    input, textarea {
      background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 10px;
      color: var(--text); font-size: 1rem; width: 100%;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }

    .checkbox-row {
      display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer;
    }
    .checkbox-row input { width: auto; cursor: pointer; }

    .btn {
      background: var(--primary); color: white; border: none; border-radius: 8px;
      padding: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; text-align: center;
      transition: background 0.2s;
    }
    .btn:active { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #status { font-size: 0.9rem; text-align: center; padding: 8px; border-radius: 6px; display: none; }
    .status-info { background: #0369a1; color: white; }
    .status-success { background: var(--success); color: white; }
    .status-error { background: var(--error); color: white; }

    /* Modal ustawień */
    #settingsModal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Skaner Magazynowy</h1>
      <button class="settings-btn" onclick="toggleSettings(true)">Ustawienia</button>
    </header>

    <div id="status"></div>

    <!-- Dane wysyłki / Klient -->
    <div class="card">
      <div class="field">
        <label>Klient / Zamówienie docelowe</label>
        <input type="text" id="clientField" placeholder="np. Firma ABC / ZAM-2026-001">
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="keepClientCheckbox" checked>
        <span>Zapamiętaj klienta dla kolejnych skanów partii</span>
      </label>
    </div>

    <!-- Skanowanie aparatem -->
    <div class="card">
      <label for="fileInput" class="camera-trigger" id="triggerArea">
        <svg width="32" height="32" fill="none" stroke="#38bdf8" stroke-width="2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Zrób zdjęcie etykiety</span>
        <small>Aparat uruchomi się natychmiast</small>
      </label>
      <input type="file" id="fileInput" accept="image/*" capture="environment">
      <img id="previewImg" alt="Podgląd etykiety">
    </div>

    <!-- Wykryte dane sprzętu -->
    <div class="card">
      <div class="field">
        <label>Model / Urządzenie</label>
        <input type="text" id="modelField" placeholder="Wykryty model">
      </div>
      <div class="field">
        <label>Numer Seryjny (S/N)</label>
        <input type="text" id="serialField" placeholder="Wykryty S/N">
      </div>
      <div class="field">
        <label>Adres MAC</label>
        <input type="text" id="macField" placeholder="XX:XX:XX:XX:XX:XX">
      </div>
      <div class="field">
        <label>Dodatkowe informacje (P/N, Part No, Uwagi)</label>
        <textarea id="extraField" rows="2" placeholder="Pozostałe parametry"></textarea>
      </div>

      <button id="saveBtn" class="btn" onclick="saveToSheets()" disabled>Zapisz w Arkuszu Google</button>
    </div>
  </div>

  <!-- Ustawienia API -->
  <div id="settingsModal">
    <div class="card" style="width: 100%; max-width: 420px;">
      <h2 style="font-size: 1.1rem; color: #38bdf8;">Konfiguracja integracji</h2>
      <div class="field">
        <label>Google Gemini API Key:</label>
        <input type="password" id="geminiApiKey" placeholder="AIzaSy...">
      </div>
      <div class="field">
        <label>URL Webhooka Google Apps Script:</label>
        <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <button class="btn" onclick="saveSettings()">Zapisz konfigurację</button>
      <button class="settings-btn" style="border: none; margin-top: 4px;" onclick="toggleSettings(false)">Zamknij</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const previewImg = document.getElementById('previewImg');
    const saveBtn = document.getElementById('saveBtn');
    const statusDiv = document.getElementById('status');
    const clientField = document.getElementById('clientField');
    const keepClientCheckbox = document.getElementById('keepClientCheckbox');

    window.onload = () => {
      document.getElementById('geminiApiKey').value = localStorage.getItem('gemini_api_key') || '';
      document.getElementById('scriptUrl').value = localStorage.getItem('gas_url') || '';
      clientField.value = localStorage.getItem('last_client') || '';
      
      if (!localStorage.getItem('gemini_api_key') || !localStorage.getItem('gas_url')) {
        toggleSettings(true);
      }
    };

    function toggleSettings(show) {
      document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
    }

    function saveSettings() {
      const key = document.getElementById('geminiApiKey').value.trim();
      const url = document.getElementById('scriptUrl').value.trim();
      if (!key || !url) return alert('Wypełnij oba pola konfiguracji.');
      
      localStorage.setItem('gemini_api_key', key);
      localStorage.setItem('gas_url', url);
      toggleSettings(false);
      showStatus('Konfiguracja zapisana pomyślnie!', 'status-success');
    }

    function showStatus(text, className) {
      statusDiv.className = className;
      statusDiv.textContent = text;
      statusDiv.style.display = 'block';
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        toggleSettings(true);
        return alert('Wprowadź darmowy klucz Gemini API w Ustawieniach.');
      }

      showStatus('Kompresowanie zdjęcia...', 'status-info');
      const base64Image = await resizeAndConvertImage(file);
      
      previewImg.src = 'data:image/jpeg;base64,' + base64Image;
      previewImg.style.display = 'block';

      showStatus('AI odczytuje dane z etykiety...', 'status-info');
      parseLabelWithGemini(base64Image, apiKey);
    });

    function resizeAndConvertImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxDim = 1400;

            if (width > height && width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function parseLabelWithGemini(base64Image, apiKey) {
      const prompt = `Jesteś precyzyjnym skanerem OCR dla logistyki magazynowej. 
Przeanalizuj etykietę i wyodrębnij:
- model (dokładny model/nazwa sprzętu)
- serial (numer seryjny, S/N)
- mac (adres fizyczny MAC, zamień na format z dwukropkami XX:XX:XX:XX:XX:XX jeśli brak separatorów)
- extra (inne widoczne parametry: Part Number, P/N, rewizja)

Zwróć TYLKO poprawny format JSON wg schematu:
{"model": "", "serial": "", "mac": "", "extra": ""}`;

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });

        const result = await response.json();
        if (result.error) throw new Error(result.error.message);

        const parsed = JSON.parse(result.candidates[0].content.parts[0].text);
        
        document.getElementById('modelField').value = parsed.model || '';
        document.getElementById('serialField').value = parsed.serial || '';
        document.getElementById('macField').value = parsed.mac || '';
        document.getElementById('extraField').value = parsed.extra || '';

        saveBtn.disabled = false;
        showStatus('Dane odczytane! Sprawdź poprawność i kliknij Zapisz.', 'status-success');
      } catch (err) {
        showStatus('Błąd odczytu AI: ' + err.message, 'status-error');
        saveBtn.disabled = false;
      }
    }

    async function saveToSheets() {
      const scriptUrl = localStorage.getItem('gas_url');
      if (!scriptUrl) return alert('Brak adresu URL do arkusza Google.');

      saveBtn.disabled = true;
      showStatus('Wysyłanie danych do arkusza...', 'status-info');

      const clientVal = clientField.value.trim();
      if (keepClientCheckbox.checked && clientVal) {
        localStorage.setItem('last_client', clientVal);
      }

      const payload = {
        client: clientVal,
        model: document.getElementById('modelField').value,
        serial: document.getElementById('serialField').value,
        mac: document.getElementById('macField').value,
        extra: document.getElementById('extraField').value
      };

      try {
        await fetch(scriptUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        showStatus('Pomyślnie dodano wiersz do Arkusza!', 'status-success');

        // Czyszczenie pól urządzenia pod kolejny skan
        setTimeout(() => {
          document.getElementById('modelField').value = '';
          document.getElementById('serialField').value = '';
          document.getElementById('macField').value = '';
          document.getElementById('extraField').value = '';
          previewImg.style.display = 'none';
          fileInput.value = '';
          statusDiv.style.display = 'none';

          if (!keepClientCheckbox.checked) {
            clientField.value = '';
            localStorage.removeItem('last_client');
          }
        }, 2000);

      } catch (err) {
        showStatus('Błąd zapisu do arkusza: ' + err.message, 'status-error');
        saveBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
